<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intended Parents Interest - Hitaishi Healthcare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; font-family: Inter, system-ui, -apple-system, sans-serif; }
    .float-input { position: relative; }
    .float-input input,
    .float-input select,
    .float-input textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; padding: 1.15rem 0.75rem 0.5rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .float-input input:focus,
    .float-input select:focus,
    .float-input textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    .float-input label { position: absolute; left: 0.75rem; top: 1rem; color: #64748b; pointer-events: none; transition: transform 0.2s, font-size 0.2s, color 0.2s; background: white; padding: 0 0.2rem; }
    .float-input input:not(:placeholder-shown) + label,
    .float-input select:not([value=""]) + label,
    .float-input textarea:not(:placeholder-shown) + label,
    .float-input input:focus + label,
    .float-input select:focus + label,
    .float-input textarea:focus + label { top: 0.3rem; transform: translateY(-0.05rem); font-size: 0.75rem; color: #2563eb; }
    .error-message { color: #dc2626; font-size: 0.8rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <main class="min-h-screen p-4 sm:p-6 lg:p-8">
    <section class="max-w-5xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-200">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Surrogacy Interest - Intended Parents</h1>
      <p class="text-slate-500 mb-6">Collecting interest information only. No matching or contact sharing is handled here.</p>

      <form id="parentsForm" class="grid gap-5 md:grid-cols-2" novalidate>
        <div class="float-input">
          <input id="full_name" name="full_name" type="text" placeholder=" " required />
          <label for="full_name">Full Name *</label>
          <p id="error_full_name" class="error-message"></p>
        </div>

        <div class="float-input">
          <input id="email" name="email" type="email" placeholder=" " required />
          <label for="email">Email *</label>
          <p id="error_email" class="error-message"></p>
        </div>

        <div class="float-input">
          <input id="phone" name="phone" type="tel" placeholder=" " required />
          <label for="phone">Phone *</label>
          <p id="error_phone" class="error-message"></p>
        </div>

        <div class="float-input">
          <select id="country" name="country" required>
            <option value="" hidden></option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
          </select>
          <label for="country">Country *</label>
          <p id="error_country" class="error-message"></p>
        </div>

        <div class="float-input">
          <select id="marital_status" name="marital_status" required>
            <option value="" hidden></option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
          <label for="marital_status">Marital Status *</label>
          <p id="error_marital_status" class="error-message"></p>
        </div>

        <div class="float-input">
          <select id="surrogacy_type" name="surrogacy_type" required>
            <option value="" hidden></option>
            <option value="Gestational">Gestational</option>
            <option value="Traditional">Traditional</option>
            <option value="Unknown">Undecided</option>
          </select>
          <label for="surrogacy_type">Surrogacy Type *</label>
          <p id="error_surrogacy_type" class="error-message"></p>
        </div>

        <div class="float-input md:col-span-2">
          <textarea id="medical_condition" name="medical_condition" rows="3" placeholder=" "></textarea>
          <label for="medical_condition">Medical Condition (optional)</label>
          <p id="error_medical_condition" class="error-message"></p>
        </div>

        <div class="float-input md:col-span-2">
          <input id="budget" name="budget" type="text" placeholder=" " />
          <label for="budget">Estimated Budget (optional)</label>
          <p id="error_budget" class="error-message"></p>
        </div>

        <div class="md:col-span-2 flex items-start gap-3">
          <input id="agreement" name="agreement" type="checkbox" class="mt-2" />
          <div>
            <label for="agreement" class="text-slate-700">I agree to terms for interest submission *</label>
            <p id="error_agreement" class="error-message"></p>
          </div>
        </div>

        <div class="md:col-span-2 flex flex-col gap-3">
          <button id="submitBtn" type="submit" class="px-5 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-semibold">Submit Interest</button>
          <p id="statusMessage" class="text-sm"></p>
        </div>
      </form>
    </section>
  </main>

  <script>
    const parentsForm = document.getElementById('parentsForm');
    const statusMessage = document.getElementById('statusMessage');

    const setError = (field, msg) => {
      document.getElementById('error_' + field).textContent = msg || '';
    };

    const validateEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    const validatePhone = (value) => /^[0-9+\-() ]{7,20}$/.test(value);

    parentsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMessage.textContent = '';
      [ 'full_name', 'email', 'phone', 'country', 'marital_status', 'surrogacy_type', 'agreement'].forEach(f => setError(f, ''));

      const formData = new FormData(parentsForm);
      const body = Object.fromEntries(formData.entries());
      body.agreement = parentsForm.agreement.checked;

      let hasError = false;
      if (!body.full_name) { setError('full_name', 'Required'); hasError = true; }
      if (!body.email || !validateEmail(body.email)) { setError('email', 'Valid email required'); hasError = true; }
      if (!body.phone || !validatePhone(body.phone)) { setError('phone', 'Valid phone required'); hasError = true; }
      if (!body.country) { setError('country', 'Required'); hasError = true; }
      if (!body.marital_status) { setError('marital_status', 'Required'); hasError = true; }
      if (!body.surrogacy_type) { setError('surrogacy_type', 'Required'); hasError = true; }
      if (!body.agreement) { setError('agreement', 'Consent required'); hasError = true; }

      if (hasError) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        const response = await fetch('/api/parents/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          statusMessage.textContent = error.message || 'Submission failed. Please try again.';
          statusMessage.className = 'text-red-600';
          return;
        }

        parentsForm.reset();
        statusMessage.textContent = 'Thank you! Your interest is submitted.';
        statusMessage.className = 'text-green-600';
      } catch (err) {
        statusMessage.textContent = 'Network error. Please try again later.';
        statusMessage.className = 'text-red-600';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Interest';
      }
    });

    // Floating behavior fallback for selects
    document.querySelectorAll('select').forEach(select => {
      select.addEventListener('change', (event) => {
        const label = event.target.nextElementSibling;
        if (event.target.value) label.classList.add('active');
      });
    });
  </script>
</body>
</html>
